services:
  db:
    image: postgres:16-alpine
    container_name: gidanobeti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gidanobeti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gidanobeti_password}
      POSTGRES_DB: ${POSTGRES_DB:-gidanobeti_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - gidanobeti_network

  redis:
    image: redis:7-alpine
    container_name: gidanobeti_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - gidanobeti_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gidanobeti_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://gidanobeti:gidanobeti_password@db:5432/gidanobeti_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-env}
      DEBUG: ${DEBUG:-True}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - gidanobeti_network

volumes:
  postgres_data:
  redis_data:

networks:
  gidanobeti_network:
    driver: bridge
